name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test and package companion skill
        run: |
          python3 -m unittest discover -s skills/wukong/scripts -p 'test_*.py'
          npm ci --prefix tooling/webusb
          npm run typecheck --prefix tooling/webusb
          npm run build --prefix tooling/webusb
          python3 scripts/skill-notices.py
          python3 scripts/prepare-scrcpy.py
          python3 scripts/build-skill-runtime.py
          python3 scripts/package-skill.py --output dist/wukong-skill.zip
      - name: Build, test and lint
        run: ./gradlew --no-daemon -PtargetAbi=arm64-v8a :agent-core:test :shell-runtime:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :shell-runtime:lintDebug :standalone-runtime:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wukong-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/wukong-skill.zip
          if-no-files-found: error
