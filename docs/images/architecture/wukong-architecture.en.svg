<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Wukong — Android Personal Agent architecture</title><desc id="desc">A user-configured model calls the normal Android App. Validated actions reach a local shell-UID engine. Restricted QuickJS uses Binder through the same validator. The engine observes and controls Android apps on the main or virtual display. Wireless ADB activates the engine.</desc>
